services:
  customer-db:
    image: postgres:17
    container_name: banking-customer-db

    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - customer_db_data:/var/lib/postgresql/data

volumes:
  customer_db_data:
